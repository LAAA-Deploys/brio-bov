name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The site is committed static HTML generated by render.py. There is no
      # build step and no npm project. A BOV or OM website must never be a
      # framework app: see the BOV/OM DESIGN LOCK in ~/.claude/CLAUDE.md and
      # ~/.codex/AGENTS.md. This guard runs server-side and cannot be skipped.
      - name: Design lock guard
        run: |
          fail=0
          for f in package.json vite.config.ts next.config.js svelte.config.js astro.config.mjs; do
            if [ -f "$f" ]; then echo "FAIL: $f present; a website must be static"; fail=1; fi
          done
          if grep -rqE '<script[^>]+type="module"|/assets/index-[A-Za-z0-9]+\.js|data-reactroot' --include='*.html' .; then
            echo "FAIL: SPA runtime output detected in HTML"; fail=1
          fi
          for f in index.html CNAME .nojekyll og.jpg 359-parke/index.html 1623-menlo/index.html; do
            if [ ! -f "$f" ]; then echo "FAIL: missing required file $f"; fail=1; fi
          done
          for f in index.html 359-parke/index.html 1623-menlo/index.html; do
            grep -q 'family=Inter' "$f" || { echo "FAIL: $f missing Inter"; fail=1; }
            grep -q 'family=DM+Serif+Display' "$f" || { echo "FAIL: $f missing DM Serif Display"; fail=1; }
            grep -q 'max-width: 1100px' "$f" || { echo "FAIL: $f missing the 1100px container"; fail=1; }
            if grep -q 'data:image' "$f"; then echo "FAIL: $f inlines base64 images"; fail=1; fi
          done
          if [ $fail -eq 0 ]; then echo "Design lock guard passed"; fi
          exit $fail

      # Retired figures must never reappear. The prior build priced Menlo at
      # $2.10M and Parke at $2.45M; every derived metric on the page was written
      # against those. When the price moved, eight narrative passages still
      # carried the old cap rates, GRMs and per-unit figures. A price change is
      # never just the price, so the old values are banned outright.
      - name: Retired-value guard
        run: |
          fail=0
          for tok in '2.10M' '$2,100,000' '6.92%' '9.45' '$262,500' '$145,336' \
                     '2.45M' '$2,450,000' '6.44%' '10.06' '$245,000' '$157,838' \
                     '$4,550,000' 'conclusively established' 'require field confirmation'; do
            if grep -rqF --include='*.html' -e "$tok" .; then
              echo "FAIL: retired value or hedging copy present: $tok"; fail=1
            fi
          done
          # every approved figure must actually be on its page
          grep -q '\$2,200,000' 1623-menlo/index.html || { echo "FAIL: Menlo price missing"; fail=1; }
          grep -q '\$2,500,000' 359-parke/index.html  || { echo "FAIL: Parke price missing"; fail=1; }
          # double-escaped entities. Passing a pre-escaped string through the
          # template escaper printed a literal "Marcus &amp; Millichap" in three
          # headings and it reached production.
          if grep -rqE '&amp;(amp|bull|middot|nbsp|quot|#[0-9]+);' --include='*.html' .; then
            echo "FAIL: double-escaped HTML entity is rendering as literal text"
            grep -rhoE '&amp;(amp|bull|middot|nbsp|quot|#[0-9]+);' --include='*.html' . | sort -u | head
            fail=1
          fi
          # the internal segment name must never reach a client-facing page
          if grep -rqiE '>[^<]*\bclients\b[^<]*<' --include='*.html' .; then
            echo "FAIL: the internal term \"Clients\" appears in visible copy; use Principals"; fail=1
          fi
          if [ $fail -eq 0 ]; then echo "Retired-value guard passed"; fi
          exit $fail

      # Data tables must never wrap. Ten columns squeezed into a fixed 700px
      # broke addresses across four lines and left row heights ragged.
      - name: Table fit audit
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8901 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8901/index.html >/dev/null && break; sleep 1; done
          node audit_tables.mjs http://localhost:8901

      # Every image and map must fit its frame. This catches what a broken-link
      # check cannot see: a wide map squeezed into a tall box and cropped, a
      # photo stretched out of aspect, or a frame left half empty. That exact
      # failure shipped here once already.
      - name: Media fit audit
        run: node audit_media.mjs http://localhost:8901

      # Every section must be reachable from the nav. Two flex-scroller defects
      # made the first and last links unreachable on a phone and neither was
      # visible to a link check or a screenshot.
      - name: Navigation audit
        run: |
          node audit_nav.mjs http://localhost:8901
          rc=$?
          rm -f package.json package-lock.json; rm -rf node_modules
          exit $rc

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
